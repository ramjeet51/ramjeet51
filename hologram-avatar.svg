<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>

    <filter id="ballGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="circleClip">
      <circle cx="160" cy="160" r="95"/>
    </clipPath>
  </defs>

  <!-- Outer soft glow pulse -->
  <circle cx="160" cy="160" r="150" fill="url(#glow)">
    <animate attributeName="r" values="140;155;140" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer rotating dashed ring -->
  <circle cx="160" cy="160" r="140" fill="none" stroke="url(#ringGrad1)"
          stroke-width="2" stroke-dasharray="4 10" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate"
                       from="0 160 160" to="360 160 160"
                       dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Middle rotating ring, opposite direction -->
  <circle cx="160" cy="160" r="122" fill="none" stroke="url(#ringGrad2)"
          stroke-width="1.5" stroke-dasharray="1 6" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate"
                       from="360 160 160" to="0 160 160"
                       dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Thin bright rotating arc -->
  <circle cx="160" cy="160" r="132" fill="none" stroke="#00f0ff"
          stroke-width="3" stroke-linecap="round"
          stroke-dasharray="60 400" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate"
                       from="0 160 160" to="360 160 160"
                       dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Orbiting ball 1: big, slow, cyan-purple-pink cycle -->
  <g filter="url(#ballGlow)">
    <circle cx="160" cy="18" r="8" fill="#00f0ff">
      <animate attributeName="fill" values="#00f0ff;#7b2ff7;#ff2ecb;#00f0ff" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
                       from="0 160 160" to="360 160 160"
                       dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- Orbiting ball 2: small, fast, purple-cyan cycle, opposite side -->
  <g filter="url(#ballGlow)">
    <circle cx="160" cy="302" r="5" fill="#7b2ff7">
      <animate attributeName="fill" values="#7b2ff7;#00f0ff;#7b2ff7" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
                       from="0 160 160" to="360 160 160"
                       dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Orbiting ball 3: medium, opposite rotation, pink-cyan cycle -->
  <g filter="url(#ballGlow)">
    <circle cx="160" cy="35" r="6.5" fill="#ff2ecb">
      <animate attributeName="fill" values="#ff2ecb;#00f0ff;#ffe066;#ff2ecb" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
                       from="360 160 160" to="0 160 160"
                       dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- Orbiting ball 4: tiny, fastest, white-hot with color flicker -->
  <g filter="url(#ballGlow)">
    <circle cx="160" cy="25" r="4" fill="#ffffff">
      <animate attributeName="fill" values="#ffffff;#00f0ff;#ffffff" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate"
                       from="0 160 160" to="360 160 160"
                       dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Static crisp inner ring border -->
  <circle cx="160" cy="160" r="98" fill="none" stroke="url(#ringGrad1)" stroke-width="3"/>

  <!-- Profile photo, clipped to circle -->
  <image href="https://github.com/ramjeet51.png" x="65" y="65" width="190" height="190"
         clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Subtle scan line sweep across the photo -->
  <clipPath id="scanClip">
    <circle cx="160" cy="160" r="95"/>
  </clipPath>
  <rect x="65" y="0" width="190" height="14" fill="#00f0ff" opacity="0.25" clip-path="url(#scanClip)">
    <animate attributeName="y" values="65;245;65" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
